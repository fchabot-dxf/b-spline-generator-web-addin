name = "projects-dansemur"
main = "src/index.js"
compatibility_date = "2024-09-01"
account_id = "014e18b89793d634a95538e7910dce19"

# Bspline / Connery / CAM Studio projects (name-keyed, no auth)
[[kv_namespaces]]
binding = "PRESETS"
id = "7c5a9da610ff46d98209265d5c270818"

# Pen Plotter projects + palettes (UUID-keyed, API key auth)
[[kv_namespaces]]
binding = "PENPLOTTER"
id = "db051a143b2744a2b69eda07b609e48e"

# Loader app registry (single document under key "registry", no auth)
[[kv_namespaces]]
binding = "LOADER_APPS"
id = "6426091a975345d08c94335424e82dc9"

# Page-view counters, LEGACY (read-only since 2026-10-11): folded once into PAGE_VIEWS_DB below by the first
# /views request after deploy (src/pageviews-route.js foldLegacyKv). Keep this binding until that fold is done.
[[kv_namespaces]]
binding = "PAGE_VIEWS"
id = "7984acbbf72a42a6a79e1f06a4367963"

# Page-view counters (D1 / SQLite): zero KV writes per view. Schema: migrations/0001_page_views.sql.
# OWNER, before the first deploy of this block, run once from cloud/preset-worker:
#   npx wrangler d1 create page-views
# and paste the printed database_id below (then apply the migration -- README "Deploy steps for the owner").
[[d1_databases]]
binding = "PAGE_VIEWS_DB"
database_name = "page-views"
database_id = "f8dd6e5c-b215-452a-8be1-e155cd04e06c"
migrations_dir = "migrations"

# STM route geometry + display config for the Nest Hub bus tracker
[[kv_namespaces]]
binding = "BUS_DATA"
id = "22def93dd78e4442b5cff16279d97e2b"

